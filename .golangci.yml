# golangci-lint configuration (v2)
version: "2"

run:
  timeout: 5m
  go: "1.26"
  tests: false

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
  disable:
    - exhaustive
    - exhaustruct
    - varnamelen
    - revive
  settings:
    errcheck:
      # AGENTS.md: handle every error. An explicit `_ = f()` discard is also
      # reported; a justified best-effort discard needs
      # `//nolint:errcheck // best-effort: <reason>`.
      check-blank: true

formatters:
  enable:
    - gofmt
