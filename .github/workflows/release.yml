name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing (OIDC) + SLSA provenance
  attestations: write # SLSA build-provenance attestations

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # SLSA build provenance. GoReleaser writes dist/checksums.txt (binaries +
      # archives) and dist/digests.txt (images + manifests); each attest step
      # batch-attests every subject listed in the file to the GitHub attestation
      # store (verify with `gh attestation verify <file|oci://image> --repo ...`).
      #
      # Gated on a public repo: the GitHub attestation API is free for public
      # repos but requires a paid plan for private ones, so these steps are
      # skipped (not failed) while the repo is private, and auto-enable on
      # going public.
      - name: Attest build provenance (binaries & archives)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest build provenance (container images)
        # digests.txt only exists once images are pushed (tagged releases, not snapshots)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/digests.txt